name: SonarQube SAST scan
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sonar:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: docker run --rm -e SONAR_HOST_URL -e SONAR_TOKEN -v "${{ github.workspace }}:/usr/src" sonarsource/sonar-scanner-cli